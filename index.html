<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Weather</h1>

    <form id="search-form" class="search">
      <div id="city-search" class="city-search">
        <input
          id="city-input"
          type="text"
          placeholder="Enter a city name..."
          autocomplete="off"
          required
        />
        <ul id="suggestions" class="suggestions hidden" role="listbox"></ul>
      </div>
      <button type="submit">Search</button>
    </form>

    <div id="status" class="status"></div>

    <section id="result" class="result hidden">
      <img id="city-image" class="city-image hidden" alt="" />
      <p id="location" class="location"></p>
      <p id="temperature" class="temperature"></p>
      <p id="condition" class="condition"></p>
      <div class="details">
        <div>
          <span class="label">Feels like</span>
          <span id="feels-like"></span>
        </div>
        <div>
          <span class="label">Humidity</span>
          <span id="humidity"></span>
        </div>
        <div>
          <span class="label">Wind</span>
          <span id="wind"></span>
        </div>
      </div>
    </section>
  </main>

  <div id="cloud-overlay" class="cloud-overlay hidden" aria-hidden="true">
    <div class="cloud" style="top: 8%; left: -10%; --sx: -55vw; --sy: -12vh; animation-delay: 0s;"></div>
    <div class="cloud" style="top: 22%; left: 55%; --sx: 60vw; --sy: 8vh; animation-delay: 0.05s;"></div>
    <div class="cloud" style="top: 42%; left: -15%; --sx: -65vw; --sy: 18vh; animation-delay: 0.1s;"></div>
    <div class="cloud" style="top: 38%; left: 48%; --sx: 58vw; --sy: -16vh; animation-delay: 0.03s;"></div>
    <div class="cloud" style="top: 60%; left: 18%; --sx: -20vw; --sy: 55vh; animation-delay: 0.08s;"></div>
    <div class="cloud" style="top: 62%; left: 62%; --sx: 30vw; --sy: 50vh; animation-delay: 0.06s;"></div>
    <div class="cloud" style="top: 78%; left: 35%; --sx: 0vw; --sy: 60vh; animation-delay: 0.12s;"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
