<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimpleWeather</title>
  <link rel="preconnect" href="https://geocoding-api.open-meteo.com" crossorigin />
  <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
  <link rel="preconnect" href="https://en.wikipedia.org" crossorigin />
  <link rel="preconnect" href="https://thumb.wikimedia.org" />
  <link rel="preconnect" href="https://api.rainviewer.com" crossorigin />
  <link rel="preconnect" href="https://tilecache.rainviewer.com" />
  <link rel="preconnect" href="https://tile.openstreetmap.org" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <span class="app-title">SimpleWeather <span aria-hidden="true">☁️</span></span>
    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      aria-label="Toggle dark mode"
    >
      🌙
    </button>
  </header>

  <div class="page-content">
  <main class="card">
    <form id="search-form" class="search">
      <div id="city-search" class="city-search">
        <input
          id="city-input"
          type="text"
          placeholder="Enter a city name..."
          autocomplete="off"
          required
        />
        <ul id="suggestions" class="suggestions hidden" role="listbox"></ul>
      </div>
      <button type="submit">Search</button>
    </form>

    <div id="status" class="status"></div>

    <section id="result" class="result hidden">
      <img id="city-image" class="city-image hidden" alt="" />
      <p id="location" class="location"></p>
      <p id="temperature" class="temperature"></p>
      <p id="condition" class="condition"></p>
      <div class="details">
        <div>
          <span class="label">Feels like</span>
          <span id="feels-like"></span>
        </div>
        <div>
          <span class="label">Humidity</span>
          <span id="humidity"></span>
        </div>
        <div>
          <span class="label">Wind</span>
          <span id="wind"></span>
        </div>
      </div>

      <p class="label radar-label">Precipitation radar</p>
      <div id="radar-map" class="radar-map"></div>
    </section>
  </main>
  </div>

  <div id="cloud-overlay" class="cloud-overlay hidden" aria-hidden="true">
    <div class="cloud" style="top: 4%; left: -12%; --sx: -55vw; --sy: -14vh; animation-delay: 0s;"></div>
    <div class="cloud" style="top: 14%; left: 62%; --sx: 60vw; --sy: -10vh; animation-delay: 0.04s;"></div>
    <div class="cloud" style="top: 24%; left: 20%; --sx: -30vw; --sy: -55vh; animation-delay: 0.09s;"></div>
    <div class="cloud" style="top: 30%; left: -18%; --sx: -65vw; --sy: 10vh; animation-delay: 0.02s;"></div>
    <div class="cloud" style="top: 36%; left: 48%; --sx: 58vw; --sy: -16vh; animation-delay: 0.07s;"></div>
    <div class="cloud" style="top: 46%; left: 78%; --sx: 62vw; --sy: 20vh; animation-delay: 0.13s;"></div>
    <div class="cloud" style="top: 50%; left: -15%; --sx: -60vw; --sy: 22vh; animation-delay: 0.11s;"></div>
    <div class="cloud" style="top: 58%; left: 30%; --sx: 0vw; --sy: 60vh; animation-delay: 0.05s;"></div>
    <div class="cloud" style="top: 62%; left: 62%; --sx: 30vw; --sy: 50vh; animation-delay: 0.16s;"></div>
    <div class="cloud" style="top: 70%; left: -12%; --sx: -55vw; --sy: 40vh; animation-delay: 0.08s;"></div>
    <div class="cloud" style="top: 74%; left: 45%; --sx: 10vw; --sy: 65vh; animation-delay: 0.14s;"></div>
    <div class="cloud" style="top: 80%; left: 15%; --sx: -20vw; --sy: 55vh; animation-delay: 0.03s;"></div>
    <div class="cloud" style="top: 84%; left: 70%; --sx: 45vw; --sy: 45vh; animation-delay: 0.1s;"></div>
    <div class="cloud" style="top: -6%; left: 35%; --sx: 5vw; --sy: -65vh; animation-delay: 0.06s;"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
